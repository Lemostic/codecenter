# ============================================================
# 本文件是整套规范体系的唯一事实源（Single Source of Truth）。
# 它描述每个规范模块的 ID、版本、文件路径、层级、依赖关系与状态。
# 任何对 .md 规范文件的变更，都必须先在 registry.yaml 中体现。
