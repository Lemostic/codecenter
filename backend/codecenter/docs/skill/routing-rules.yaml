# ============================================================
# 三、SPI 领域插件路由（按 fingerprint.domains 匹配）
# ============================================================
spi_domains:

  - domain: "data-governance"
    profile_id: "spi-data-governance"
    spec_file: "spi/data-governance/domain-spec.md"
    profile_file: "spi/data-governance/_profile.yaml"
    active: true
    keywords: ["数据治理", "数据质量", "元数据", "数据血缘", "数据分类"]

  - domain: "mdm-frontend"
    profile_id: "spi-mdm-frontend"
    spec_file: "spi/mdm-frontend/domain-spec.md"
    profile_file: "spi/mdm-frontend/_profile.yaml"
    skill_file: "spi/mdm-frontend/SKILL.md"
    active: true
    keywords: ["主数据", "MDM", "TpTable", "TpPageFrame", "TpLeftTreeLayout", "TpCardList", "ModelCard", "TpPagination", "useCrudList", "useImportExport", "useFormValidation", "statusTagType", "@mdm", "apps/modules", "monorepo"]

# ============================================================
# 四、覆盖机制说明
# ============================================================
# 1. manifest 中的 overrides.disabled_specs 可以禁用任意非 universal 规范
#    示例：disabled_specs: ["ddd-cqrs"] 将跳过 CQRS 规范加载
#
# 2. manifest 中的 overrides.forced_specs 可以强制加载任意规范（无视匹配规则）
#    示例：forced_specs: ["spi-data-governance"] 将强制加载数据治理规范
#
# 3. universal_specs 不可被 disabled_specs 禁用（始终加载）
#
# 4. 覆盖操作将被记录到 .spec/override-log.yaml 中，供审计使用

